# Local stack. `make up` starts only Postgres and Redis; the app services sit behind
# the `app` profile (`docker compose --profile app up -d --build`), and Jaeger behind the
# `tracing` profile (`make tracing-up`; set OTEL_ENABLED=true to export spans to it).
name: workflow-engine

x-app: &app
  build: .
  image: workflow-engine:local
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATABASE_URL: ""
    REDIS_URL: redis://redis:6379/0
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    FASTEMBED_CACHE_DIR: /app/.cache/fastembed
  volumes:
    # The embedding model (~65 MB) is downloaded once and shared by the API and workers.
    - modelcache:/app/.cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  profiles: ["app"]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-workflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 128m
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 256m

  api:
    <<: *app
    command: ["python", "-m", "workflow_engine.api"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      FASTEMBED_CACHE_DIR: /app/.cache/fastembed
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
    # Room for the ONNX embedding model, loaded on the first /embeddings/search.
    mem_limit: 512m

  worker:
    <<: *app
    command: ["python", "-m", "workflow_engine.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 40s
    expose:
      - "9100"  # /metrics
    # Room for the ONNX embedding model, loaded on the first embed_texts job.
    mem_limit: 512m

  # Scheduler, reaper, and sweeper. Extra replicas are safe: they wait on the leader lock.
  maintenance:
    <<: *app
    command: ["python", "-m", "workflow_engine.maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m

  # Traces UI on http://localhost:16686; OTLP/HTTP on 4318.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"
      - "4318:4318"
    mem_limit: 256m
    restart: unless-stopped
    profiles: ["tracing"]

volumes:
  pgdata:
  redisdata:
  modelcache:
